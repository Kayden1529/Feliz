```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torta Decorada 17</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  background: #000000;
  font-family: Arial, sans-serif;
}

/* FUEGOS ARTIFICIALES */
canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}

/* CONTENEDOR DE LA TORTA */
.cake {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  width: 380px;
}

/* FLORES */
.flowers {
  font-size: 35px;
  margin-bottom: 5px;
}

/* NÚMERO 18 */
.number {
  font-size: 75px;
  font-weight: bold;
  color: #FFD700;
  text-shadow:
    3px 3px #8B6508,
    0 0 15px #FFD700;
  margin-bottom: 12px;
}

/* CAPAS DE LA TORTA */
.layer {
  margin-left: auto;
  margin-right: auto;
  border-radius: 20px;
  background: #000080;
  border: 4px solid #f7f7f7;
  position: relative;
  box-shadow:
    0 0 10px rgba(255,215,0,.7),
    0 6px 20px rgba(0,0,0,.7);
}

/* DECORACIÓN DORADA */
.layer::before {
  content: "✦  ✦  ✦  ✦  ✦";
  position: absolute;
  left: 0;
  top: 25px;
  width: 100%;
  font-size: 22px;
  color: #fbfbf8;
  text-shadow: 0 0 8px #FFD700;
}

/* PARTE SUPERIOR */
.layer::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 18px;
  background: #daf7f7;
  border-radius: 16px 16px 0 0;
}

/* TAMAÑOS */
.bottom {
  width: 320px;
  height: 95px;
}

.middle {
  width: 220px;
  height: 80px;
  margin-top: -5px;
}

.top {
  width: 170px;
  height: 75px;
  margin-top: -5px;
}

/* MENSAJE */
.message {
  margin-top: 20px;
  font-size: 25px;
  color: #FFD700;
  font-weight: bold;
  text-shadow: 0 0 8px rgba(255,215,0,.8);
  line-height: 1.4;
}

/* ANIMACIÓN SUAVE DEL MENSAJE */
.message span {
  color: white;
}

/* RESPONSIVE PARA CELULAR */
@media (max-width: 500px) {
  .cake {
    width: 100%;
  }

  .bottom {
    width: 280px;
  }

  .middle {
    width: 190px;
  }

  .top {
    width: 150px;
  }

  .number {
    font-size: 65px;
  }

  .message {
    font-size: 21px;
  }
}
</style>
</head>

<body>

<canvas id="fuegos"></canvas>

<div class="cake">

  <div class="flowers">🥳🥳🥳🥳</div>

  <div class="number">17</div>

  <div class="layer top"></div>
  <div class="layer middle"></div>
  <div class="layer bottom"></div>

  <div class="message">
   🎊Feliz cumpleaños 17, Niliana<br>
    <span>✨Espero que tengas un feliz cumple✨</span>
  </div>

</div>

<script>
const canvas = document.getElementById("fuegos");
const ctx = canvas.getContext("2d");

function ajustarCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

ajustarCanvas();
window.addEventListener("resize", ajustarCanvas);

let fuegos = [];
let particulas = [];

/* DISPARAR DESDE LOS COSTADOS */
function disparar() {

  // Alterna entre izquierda y derecha
  const ladoIzquierdo = Math.random() < 0.5;

  const x = ladoIzquierdo
    ? Math.random() * (canvas.width * 0.25)
    : canvas.width - Math.random() * (canvas.width * 0.25);

  const y = canvas.height + 10;

  // Dirección hacia el centro
  const objetivoX = canvas.width / 2 +
                    (Math.random() - 0.5) * 300;

  const objetivoY = canvas.height * 0.25 +
                    Math.random() * canvas.height * 0.35;

  const dx = objetivoX - x;
  const dy = objetivoY - y;
  const distancia = Math.sqrt(dx * dx + dy * dy);

  fuegos.push({
    x: x,
    y: y,
    vx: dx / distancia * 7,
    vy: dy / distancia * 7,
    objetivoY: objetivoY
  });
}

/* EXPLOSIÓN BLANCA */
function explotar(x, y) {

  for (let i = 0; i < 120; i++) {

    const angulo = Math.random() * Math.PI * 2;
    const velocidad = Math.random() * 6 + 2;

    particulas.push({
      x: x,
      y: y,
      vx: Math.cos(angulo) * velocidad,
      vy: Math.sin(angulo) * velocidad,
      vida: 100,
      tamaño: Math.random() * 2 + 1
    });
  }
}

/* ANIMACIÓN */
function animar() {

  ctx.fillStyle = "rgba(0,0,0,0.20)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  /* COHETES */
  fuegos.forEach((fuego, index) => {

    fuego.x += fuego.vx;
    fuego.y += fuego.vy;

    fuego.vy += 0.035;

    ctx.fillStyle = "white";
    ctx.shadowBlur = 10;
    ctx.shadowColor = "white";

    ctx.beginPath();
    ctx.arc(fuego.x, fuego.y, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;

    /* Cuando llega arriba, explota */
    if (fuego.y <= fuego.objetivoY) {

      explotar(fuego.x, fuego.y);
      fuegos.splice(index, 1);
    }
  });

  /* PARTÍCULAS */
  particulas.forEach((p, index) => {

    p.x += p.vx;
    p.y += p.vy;

    p.vx *= 0.98;
    p.vy *= 0.98;

    p.vy += 0.035;

    p.vida--;

    ctx.fillStyle =
      `rgba(255,255,255,${p.vida / 100})`;

    ctx.shadowBlur = 8;
    ctx.shadowColor = "white";

    ctx.beginPath();
    ctx.arc(
      p.x,
      p.y,
      p.tamaño,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.shadowBlur = 0;

    if (p.vida <= 0) {
      particulas.splice(index, 1);
    }
  });

  requestAnimationFrame(animar);
}

/* FUEGOS CADA 100 MILISEGUNDOS */
setInterval(disparar, 100);

animar();
</script>

</body>
</html>
